syntax = "proto3";

package upload.v1;

import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/towardsyou/kratos-contrib/examples/upload/api/upload/v1;v1";

service UploadService {
  rpc Presign(PresignRequest) returns (PresignResponse) {
    option (google.api.http) = {post: "/v1/upload/presign" body: "*"};
  }
  rpc Complete(CompleteRequest) returns (CompleteResponse) {
    option (google.api.http) = {post: "/v1/upload/complete" body: "*"};
  }
  rpc List(ListRequest) returns (ListResponse) {
    option (google.api.http) = {get: "/v1/upload"};
  }
  rpc Download(DownloadRequest) returns (DownloadResponse) {
    option (google.api.http) = {get: "/v1/upload/{key}/download"};
  }
}

message PresignRequest {
  string filename = 1;
  string content_type = 2;
  int64 size = 3;
}

message PresignResponse {
  string key = 1;
  SignedRequest request = 2;
}

message SignedRequest {
  string url = 1;
  string method = 2;
  map<string, HeaderValues> headers = 3;
  google.protobuf.Timestamp expires_at = 4;
}

message HeaderValues {
  repeated string values = 1;
}

message CompleteRequest {
  string key = 1;
}

message CompleteResponse {
  Upload upload = 1;
}

message ListRequest {}

message ListResponse {
  repeated Upload uploads = 1;
}

message DownloadRequest {
  string key = 1;
}

message DownloadResponse {
  SignedRequest request = 1;
}

message Upload {
  string key = 1;
  string filename = 2;
  int64 size = 3;
  string status = 4;
}
