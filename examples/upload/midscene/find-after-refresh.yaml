page:
  url: "${UPLOAD_BASE_URL}/"
  output: midscene_run/find-after-refresh.json
agent:
  reportFileName: find-after-refresh
tasks:
  - name: 再次找到文件
    flow:
      - aiTap: 点击「以测试用户登录」
      - aiWaitFor: 页面显示「已登录 · 测试用户」
      - aiTap: 点击「选择文件」打开文件选择器
        fileChooserAccept: ./fixtures/山景.jpg
      - aiTap: 点击「上传文件」
      - aiWaitFor: 页面显示「上传成功：山景.jpg」，并且「我的文件」中出现「山景.jpg」
      - aiTap: 点击「我的文件」区域右上角的「刷新页面」
      - aiWaitFor: 刷新后「我的文件」中仍有「山景.jpg」，上传区域恢复为「未选择文件」
      - aiTap: 点击「我的文件」中第一条「山景.jpg」旁边的「下载原文件」
      - aiAssert: 刷新后「我的文件」中仍能找到「山景.jpg」，并显示「已下载 山景.jpg」
